; The map pak cook (Tools/Cook/Cook-MapPaks.ps1 passes -CustomConfig=MapPaks). Layered over Config/DefaultGame.ini
; only for that cook (the engine's CustomConfig layer, {PROJECT}/Config/Custom/{CUSTOMCONFIG}/Default{TYPE}.ini, comes
; right after Config/Default*.ini): the imported maps are cooked into IoStore containers of their own, one per map plus
; one shared pack, as OpenSCCT-Unreal-Content's docs/FORMAT.md describes. A release (Tools/Package-Release.ps1) never
; reads it, and UAT does not stage another custom config's files. The asset manager rule for GameFeatureData and the
; release's own packaging settings come from Config/DefaultGame.ini.

[/Script/UnrealEd.ProjectPackagingSettings]
UsePakFile=True
bUseIoStore=True
bCompressed=True
; Each chunk gets its own shader library, inside its own container, opened when the container is mounted.
bShareMaterialShaderCode=True
; One container per chunk: pakchunk0 is the game, pakchunk100 the shared imported content, pakchunk101 and up the
; maps (UScctMapPakAssetManager assigns them).
bGenerateChunks=True
bSkipEditorContent=True
; The release's lists are replaced, not added to: the release always cooks all of /Game/Imported/Maps into its one
; container, while this cook puts each map in a container of its own. The maps and the shared folders are added by the
; asset manager (-ScctMapPaks), so nothing else of /Game/Imported is cooked.
!MapsToCook=ClearArray
+MapsToCook=(FilePath="/Game/OpenSCCT/Maps/L_FrontEnd")
!DirectoriesToAlwaysCook=ClearArray
+DirectoriesToAlwaysCook=(Path="/Game/OpenSCCT")
!DirectoriesToNeverCook=ClearArray
