; The map pak cook (Tools/Cook/Cook-MapPaks.ps1 passes -CustomConfig=MapPaks). Layered over Config/DefaultGame.ini
; only for that cook: the imported maps are cooked into IoStore containers of their own, one per map plus one shared
; pack, as OpenSCCT-Unreal-Content's docs/FORMAT.md describes. A release (Tools/Package-Release.ps1) never reads it.

; The editor's MCP toolsets (AllToolsets) bring the GameFeatures plugin into the editor, and it reports an error, which
; fails a cook, unless the asset manager has a rule for its asset type. The game has no game features: editor only.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

[/Script/UnrealEd.ProjectPackagingSettings]
UsePakFile=True
bUseIoStore=True
bCompressed=True
; Each chunk gets its own shader library, inside its own container, opened when the container is mounted.
bShareMaterialShaderCode=True
; One container per chunk: pakchunk0 is the game, pakchunk100 the shared imported content, pakchunk101 and up the
; maps (UScctMapPakAssetManager assigns them).
bGenerateChunks=True
bSkipEditorContent=True
+MapsToCook=(FilePath="/Game/OpenSCCT/Maps/L_FrontEnd")
+DirectoriesToAlwaysCook=(Path="/Game/OpenSCCT")
; A release never cooks /Game/Imported; this cook exists to cook it. The maps and the shared folders are added by the
; asset manager (-ScctMapPaks), so nothing else of /Game/Imported is cooked.
!DirectoriesToNeverCook=ClearArray
