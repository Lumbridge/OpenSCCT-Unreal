[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Engine.GameModeBase
; The game starts in the front end (the menu and the online lobby). Opening an imported map directly still
; starts a local match on it.
GameDefaultMap=/Game/OpenSCCT/Maps/L_FrontEnd.L_FrontEnd

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
; Headphones (Audio.OutputMode, Play/ScctAudioOutput.h) renders the match's 3D voices binaurally, by HRTF, through
; Resonance Audio. Its spatializer only works with its reverb plugin beside it (that reverb takes only the voices
; that ask for it, none of the game's: the rooms' reverb stays the engine's own). Speakers keeps the engine's panning.
SpatializationPlugin=Resonance Audio
ReverbPlugin=Resonance Audio

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections, with hardware ray tracing where the card has it.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDFs=0
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.GenerateMeshDistanceFields=True
; Nanite geometry and virtual shadow maps: sharp shadows are the heart of a stealth game.
r.Nanite.ProjectEnabled=True
r.Shadow.Virtual.Enable=1
; Many shadowed lights per map: MegaLights keeps their cost flat.
r.MegaLights.EnableForProject=True
r.Substrate=True
r.VirtualTextures=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
; Imported maps can opt into a native lightmap and Volumetric Lightmap build.
r.AllowStaticLighting=True
r.CustomDepth=3
; The virtual shadow maps write a development warning over the picture when a view has many meshes that are
; not Nanite (ClubE from its roof). It is not for players; the log still has it.
r.Shadow.Virtual.AllowScreenOverflowMessages=0
; Glass and water reflect the room through Lumen's front-layer reflections (the levels' post-process volume asks
; for them; without the project switch they only get the coarse radiance cache).
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; The maps' projected pictures and shaped lamps are light functions drawn into an atlas: 256 pixels each instead of
; 128 (the cinema's film), and room for 64 in view instead of 16 (one map already uses 11).
r.LightFunctionAtlas.SlotResolution=256
r.LightFunctionAtlas.Size=8

[ConsoleVariables]
; Reject stale lighting sooner. TSR's offset applies only to its history comparison, including in dark rooms.
r.TSR.ShadingRejection.ExposureOffset=2.0
; Keep MegaLights' spatial denoiser and enough history for it to filter stable lighting.
r.MegaLights.Temporal.MaxFramesAccumulated=8
r.MegaLights.Temporal.MinFramesAccumulatedForHistoryMiss=1

; Pipeline states are compiled before they are needed, not on the frame that first draws them. PSO precaching
; compiles them as each component is created (the effects warm-up behind the loading page creates one of each effect,
; Play/ScctEffectsWarmup.h, and keeps the page up until those are done). The PSO cache records the states a run
; used and compiles them again early on the next run (its batches run fast while the warm-up holds the page and in
; the background in play); it takes effect in a cooked build, where the shader code library it needs exists.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.ReportPSO=1
r.ShaderPipelineCache.SaveUserCache=1
r.ShaderPipelineCache.StartupMode=1

; Keep the display settings in control of per-user upscaling and frame generation.
[/Script/FFXFSRSettings.FFXFSRSettings]
r.FidelityFX.FSR.Enabled=0
r.FidelityFX.FI.Enabled=0
; The upscaler can use project velocity settings without forcing extra geometry passes on every renderer.
r.FidelityFX.FSR.ForceVertexDeformationOutputsVelocity=0

[/Script/Engine.AudioSettings]
; The match's sound (Play/ScctAudioSubsystem) keeps up to 48 event voices plus the map's ambient loops and the
; music; the engine's default of 32 would drop voices before the game's own rule is asked.
+QualityLevels=(DisplayName=NSLOCTEXT("AudioSettings", "DefaultSettingsName", "Default"),MaxChannels=96)

[/Script/Engine.UserInterfaceSettings]
; Query display bounds and size the game window in physical pixels on scaled Windows desktops.
bAllowHighDPIInGameMode=True

[/Script/Engine.Engine]
; The engine's 10 cm near plane cuts into whatever the camera is pushed against: the spy's own head with a wall
; behind him, and the wall itself at the picture's corners (the simulation keeps the camera 12 units clear, the
; corners of a 10 cm near plane reach 15). The original drew from 2 units.
NearClipPlane=3.0
; The console's Get and Set of a setting come before the engine's GET and SET of class properties (Play/ScctLocalPlayer.h).
LocalPlayerClassName=/Script/OpenSCCT.ScctLocalPlayer
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/OpenSCCT")

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

