[ShadowQuality@0]
; Doors, walls and grilles block light on stealth routes. Keep the Low shadow budgets,
; and draw both the low-resolution shadow map and the fixture's authored light mask.
r.ShadowQuality=1
r.LightFunctionQuality=1

[GlobalIlluminationQuality@1]
; Medium's Irradiance Field Gather fills shadows on maps such as Moonlight Park.
; Keep Medium's distance-field ambient occlusion and reserve Lumen diffuse GI for High and above.
r.Lumen.DiffuseIndirect.Allow=0
