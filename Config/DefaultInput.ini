[/Script/Engine.InputSettings]
; The simulation does its own mouse look from raw device counts (its sensitivity, scope and clutch factors), and
; the player controller reads those counts before Unreal touches them (UPlayerInput::GetRawKeyValue, see
; Source/OpenSCCT/Play/ScctPlayerController.h). The settings below only keep Unreal's own massaged mouse values
; honest for anything else that reads them: no smoothing (it lags and depends on the frame rate), no scaling by
; the camera's field of view, and one unit per count.
bEnableMouseSmoothing=False
bEnableFOVScaling=False
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))

; The game takes the mouse when it starts and keeps it (hidden cursor, raw high precision movement): no first
; click needed, and the cursor cannot wander off the window in the middle of a turn.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; F11 is a key of the game's own bindings (the original's "Quit"); Alt+Enter still switches full screen.
bF11TogglesFullscreen=False

[/Script/Engine.PlayerInput]
; The engine's development keys are taken away: F1 to F5 (wireframe, unlit, lit and the other view modes) and the
; rest sit on keys the game's own bindings use (F1 and F2 are the goggles, F3 to F10 the interface), so a goggle
; key would also have thrown the picture into wireframe. The console key is not one of these and stays.
!DebugExecBindings=ClearArray
