; A release build (Tools/Package-Release.ps1, docs/RELEASING.md). Nothing under /Game/Imported is ever cooked: it is
; the original game's content, imported on the player's own machine and never published. What ships is this
; project's own content (the front end, materials, the merc rifle, the CC0 texture sets) and the C# bridge.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
BuildTarget=OpenSCCTUnreal
ForDistribution=True
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
bShareMaterialShaderCode=True
; The shared shader library in hash order, not cook order: unchanged shaders keep their place from one release to the
; next, so the launcher's binary patches stay small.
bDeterministicShaderCodeOrder=True
; The Visual C++ runtime installer ships next to the game instead (Package-Release.ps1); the engine's own
; prerequisites installer is not part of this engine install.
IncludePrerequisites=False
IncludeCrashReporter=False
InternationalizationPreset=English
